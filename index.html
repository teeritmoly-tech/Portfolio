<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h1, h2, h3 { color: #ffffff; margin-top: 0; }
        .section {
            background: #1e1e1e;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        /* จัดเรียงรูปภาพและข้อความใน Header ด้วย Flexbox */
        #header-section {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        
        /* ตั้งค่ารูปโปรไฟล์ให้เป็นวงกลม */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4CAF50;
        }

        .skill-tag {
            display: inline-block;
            background: #333;
            color: #fff;
            padding: 6px 12px;
            margin: 5px 5px 5px 0;
            border-radius: 4px;
            font-size: 0.9em;
            border: 1px solid #444;
        }
        .project {
            border-left: 4px solid #4CAF50;
            padding-left: 15px;
            margin-bottom: 20px;
            background: #252525;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-right: 15px;
            border-radius: 0 8px 8px 0;
        }
        .project h3 { margin-bottom: 5px; color: #4CAF50; }
        .project p { margin: 0; color: #bbb; }
    </style>
</head>
<body>
    <div class="container">
        <header class="section" id="header-section">
            <!-- แทรกรูปภาพ Portfolio.png -->
            <img src="Portfolio.png" alt="Profile Picture" class="profile-img">
            
            <div class="header-text">
                <h1 id="name"></h1>
                <h3 id="title"></h3>
                <p id="education"></p>
            </div>
        </header>

        <section class="section">
            <h2>เกี่ยวกับฉัน</h2>
            <p id="about"></p>
        </section>

        <section class="section">
            <h2>ทักษะ (Skills)</h2>
            <div id="skills"></div>
        </section>

        <section class="section">
            <h2>ผลงาน (Projects)</h2>
            <div id="projects"></div>
        </section>
    </div>

    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('name').textContent = data.name;
                document.getElementById('title').textContent = data.title;
                document.getElementById('education').textContent = data.education;
                document.getElementById('about').textContent = data.about;
                
                const skillsContainer = document.getElementById('skills');
                data.skills.forEach(skill => {
                    const span = document.createElement('span');
                    span.className = 'skill-tag';
                    span.textContent = skill;
                    skillsContainer.appendChild(span);
                });

                const projectsContainer = document.getElementById('projects');
                data.projects.forEach(project => {
                    const div = document.createElement('div');
                    div.className = 'project';
                    div.innerHTML = `<h3>${project.name}</h3><p>${project.description}</p>`;
                    projectsContainer.appendChild(div);
                });
            })
            .catch(error => console.error('Error loading JSON:', error));
    </script>
</body>
</html>
